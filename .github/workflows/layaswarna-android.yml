name: Layaswarna Android validation

on:
  push:
    branches: [feat/pifauna-phone-audio, feat/layaswarna-audio-route-v11, feat/layaswarna-audit-reconciliation-v12, 'feat/layaswarna-*']
    paths:
      - 'PiFauna/**'
      - '.github/workflows/layaswarna-android.yml'
  pull_request:
    paths:
      - 'PiFauna/**'
      - '.github/workflows/layaswarna-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layaswarna-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: PiFauna
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Install Android API 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Validate unit tests, APK and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Publish validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layaswarna-validation-reports
          path: |
            PiFauna/app/build/reports/
            PiFauna/app/build/outputs/apk/debug/
          if-no-files-found: ignore

  emulator:
    name: Android emulator API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    defaults:
      run:
        working-directory: PiFauna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_4
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          working-directory: PiFauna
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard || true
            adb shell svc power stayon true
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumented test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layaswarna-instrumentation-api-${{ matrix.api }}
          path: PiFauna/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
