name: Layaswarna Android validation

on:
  push:
    branches: [feat/pifauna-phone-audio]
    paths:
      - 'PiFauna/**'
      - '.github/workflows/layaswarna-android.yml'
  pull_request:
    paths:
      - 'PiFauna/**'
      - '.github/workflows/layaswarna-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: PiFauna
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validate unit tests, APK and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Publish validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layaswarna-validation-reports
          path: |
            PiFauna/app/build/reports/
            PiFauna/app/build/outputs/apk/debug/
          if-no-files-found: ignore
