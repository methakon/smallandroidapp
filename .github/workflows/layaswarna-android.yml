name: Layaswarna Android validation

on:
  push:
    branches: [feat/pifauna-phone-audio, feat/layaswarna-audio-output-consent-v11]
    paths:
      - 'PiFauna/**'
      - '.github/workflows/layaswarna-android.yml'
  pull_request:
    paths:
      - 'PiFauna/**'
      - '.github/workflows/layaswarna-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layaswarna-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: PiFauna
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Install Android API 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Validate unit tests, APK and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Publish validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layaswarna-validation-reports
          path: |
            PiFauna/app/build/reports/
            PiFauna/app/build/outputs/apk/debug/
          if-no-files-found: ignore
